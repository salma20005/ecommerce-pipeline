# ============================================================
# Stage 1: Kafka (KRaft mode - no Zookeeper, lighter on RAM)
# Later stages add: HDFS, Spark, ClickHouse, Airflow, FastAPI
# ============================================================
services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"   # broker
      - "8081:8080"   # built-in UI (optional)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # single-node defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # allow big messages (a batch of events per message)
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      # topic auto-creation defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    mem_limit: 1500m

  # Python "replay producer": reads the CSV like a live clickstream
  # and pushes events to Kafka topic: user-events
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      # D:/bigdata is where we keep the CSV (created in the next step)
      CSV_PATH: /data/2019-Oct.csv
      TOPIC: user-events
      # replay speed: 0 = as fast as possible, 500 = 500 events/sec
      EVENTS_PER_SEC: 2000
    volumes:
      - D:/bigdata:/data
    # 1536m: the default 512m crashed with OOM while parsing the 5 GB CSV.
    mem_limit: 1536m

  # ============================================================
  # Stage 3: HDFS (single node) + Spark (local mode)
  # ============================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"   # HDFS web UI
    environment:
      - CLUSTER_NAME=ecommerce
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - D:/bigdata/hadoop_namenode:/hadoop/dfs/name
    mem_limit: 1g

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    ports:
      - "9864:9864"   # datanode web UI
    environment:
      - CLUSTER_NAME=ecommerce
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - D:/bigdata/hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    # 4g: the datanode crashed at 2g ("Cannot allocate memory") while the
    # ETL wrote 3 partitioned-by-date datasets in parallel.
    mem_limit: 4g

  # Spark runs in local mode: one container, [2] threads.
  # Jobs are submitted into it with docker exec ... spark-submit
  # (Official Apache image + numpy for MLlib -- see spark/Dockerfile)
  spark:
    build: ./spark
    container_name: spark
    environment:
      - SPARK_MODE=local
    ports:
      - "4040:4040"   # Spark job UI (while a job runs)
    volumes:
      - ./spark:/opt/spark-jobs
      - D:/bigdata:/data
    command: sleep infinity
    mem_limit: 7g

  # ============================================================
  # Stage 4: ClickHouse - analytical serving layer.
  # HDFS stores the big files; ClickHouse answers dashboard
  # queries in milliseconds. Power BI reads it via HTTP (host :18123).
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      # Host port = 18123, container port = 8123 (unchanged).
      # Windows reserves dynamic Hyper-V/WSL exclusion ranges that have
      # included 8083-8182 on this laptop -- 8123 fell inside and Docker
      # got WSAEACCES ("forbidden by its access permissions") on bind.
      # 18123 sits outside every observed range and needs no admin rights.
      # In-compose traffic keeps using the service name, i.e. clickhouse:8123.
      - "18123:8123"   # HTTP API from Windows (Power BI, curl)
      - "9000:9000"   # native protocol (Spark JDBC)
    environment:
      CLICKHOUSE_DB: ecommerce
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      # named volume, not D:/bigdata bind mount: the clickhouse user (uid 101)
      # gets Permission denied writing to a Windows-mounted folder.
      # The volume still lives on the D: drive (Docker's VHDX is there).
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    mem_limit: 1g

  # Tiny Python consumer: Kafka summary topics -> ClickHouse tables.
  # Reuses the producer image (already has kafka-python) with a
  # different command, so no extra image build is needed.
  ch-loader:
    image: ecommerce-pipeline-producer:latest
    container_name: ch-loader
    depends_on:
      - kafka
      - clickhouse
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ecommerce
    volumes:
      - ./loader/clickhouse_loader.py:/app/clickhouse_loader.py:ro
    command: python clickhouse_loader.py
    restart: unless-stopped
    mem_limit: 256m

  # ============================================================
  # Model deployment (FastAPI) - poster: "MODEL DEPLOYMENT".
  # Serves the best model saved by ml_training.py in HDFS /models.
  # Built FROM the Spark image: loading a Spark ML model needs
  # PySpark + JVM + the HDFS client.
  # Interactive docs at http://localhost:8000/docs
  # ============================================================
  api:
    build: ./api
    container_name: api
    depends_on:
      - namenode
      - datanode
    ports:
      - "8000:8000"   # GET /  |  POST /predict  |  /docs
    environment:
      MODEL_PATH: hdfs://namenode:9000/models/best_model
    restart: unless-stopped
    mem_limit: 2g

  # ============================================================
  # Stage 6: Airflow - batch workflow orchestration (poster box).
  # Postgres holds the metadata; the scheduler carries the docker CLI
  # so DAG tasks run the already-proven spark-submit commands via
  # `docker exec`.  Airflow moves no data itself -- it owns order,
  # retries, logs and the two validate_* gates.
  # Web UI: http://localhost:8080  (admin / admin)
  # ============================================================
  airflow-db:
    image: postgres:15-alpine
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 6

  airflow-init:
    build: ./airflow
    container_name: airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    # NOTE: the official image entrypoint prefixes bare commands with "airflow",
    # so "bash" (not /bin/bash) is the magic word that runs a shell directly.
    command: ["bash", "-c", "airflow db migrate && airflow users create -u admin -p admin -r Admin -e admin@example.com -f Admin -l User || true"]
    restart: "no"
    mem_limit: 512m

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      spark:
        condition: service_started
      namenode:
        condition: service_started
      clickhouse:
        condition: service_started
    environment: *airflow-env
    command: airflow scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      # tasks call `docker exec ...` -- the socket is srw-rw---- root:root,
      # hence group 0 below
      - /var/run/docker.sock:/var/run/docker.sock
      # read-only: only the validate_input_file task peeks at the CSV
      - D:/bigdata:/data:ro
    group_add:
      - "0"
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  airflow-webserver:
    build: ./airflow
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: airflow webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      # python3, not curl: the slim image has no curl and adding it costs an
      # apt-get round-trip that keeps dying on this connection. urlopen()
      # raises on any non-2xx, so a clean return == healthy.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

# Named volumes (Docker manages them; physically on the D: drive VHDX)
volumes:
  clickhouse-data:
  airflow-db-data:
